name: Build (Windows, Linux, macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ProControllerConnect-windows-x86_64
          path: target/release/ProControllerConnect.exe

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 & WebKit2GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Build release
        run: |
          cargo build --release
          cp target/release/ProControllerConnect ProControllerConnect-linux-x86_64
          tar -czf ProControllerConnect-linux-x86_64.tar.gz -C target/release ProControllerConnect
      - uses: actions/upload-artifact@v4
        with:
          name: ProControllerConnect-linux-x86_64
          path: |
            ProControllerConnect-linux-x86_64
            ProControllerConnect-linux-x86_64.tar.gz

  build-macos:
    name: macOS (Universal .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Build Universal macOS .app bundle
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP="Pro Controller Connect.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/ProControllerConnect \
            target/x86_64-apple-darwin/release/ProControllerConnect \
            -output "$APP/Contents/MacOS/ProControllerConnect"
          chmod +x "$APP/Contents/MacOS/ProControllerConnect"
          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Pro Controller Connect</string>
            <key>CFBundleDisplayName</key>
            <string>Pro Controller Connect</string>
            <key>CFBundleIdentifier</key>
            <string>com.youareincredible.procontrollerconnect</string>
            <key>CFBundleVersion</key>
            <string>1.4.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.4.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>ProControllerConnect</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSBluetoothAlwaysUsageDescription</key>
            <string>Pro Controller Connect manages Bluetooth pairing for your controller.</string>
          </dict>
          </plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent "$APP" ProControllerConnect-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ProControllerConnect-macos-universal
          path: ProControllerConnect-macos-universal.zip
