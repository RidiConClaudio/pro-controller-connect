[package]
name = "pro-controller-connect"
version = "1.3.0"
edition = "2021"
description = "Automatic Bluetooth reconnection for the Pro Controller"
license = "MIT"
publish = false

[[bin]]
name = "ProControllerConnect"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Power",
    "Devices_Radios",
    "Gaming_Input",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
